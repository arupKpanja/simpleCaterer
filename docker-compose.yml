# Default stack: Postgres + API in containers, using an Ollama that runs
# natively on the host (recommended — the LLM keeps the host's RAM/GPU and the
# containers stay light).
#
#   docker compose up --build
#
# The API reaches the host Ollama via host.docker.internal. Make the host Ollama
# listen on all interfaces so the container can reach it:
#   Windows/macOS: set env OLLAMA_HOST=0.0.0.0 and restart Ollama, then
#                  `ollama pull llama3.1:8b`.
#
# To instead bundle Ollama as a container (needs a Docker VM with enough RAM/disk
# for the model), add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.bundled-llm.yml up --build
#
# Until a model is available the API serves the deterministic planner, so the
# stack is usable immediately either way.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caterer
      POSTGRES_PASSWORD: caterer
      POSTGRES_DB: caterer
    volumes:
      - caterer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caterer -d caterer"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      CATERER_DATABASE_URL: postgresql+psycopg://caterer:caterer@db:5432/caterer
      CATERER_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CATERER_OLLAMA_MODEL: llama3.1:8b
      CATERER_CHECKPOINT_DB_PATH: /data/checkpoints.db
    extra_hosts:
      # lets the container resolve the host (needed on Linux; harmless elsewhere)
      - "host.docker.internal:host-gateway"
    ports:
      # host port configurable to avoid conflicts: CATERER_API_PORT=8080 docker compose up
      - "${CATERER_API_PORT:-8000}:8000"
    volumes:
      - caterer_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caterer_db:
  caterer_data:
