# Optional override: bundle Ollama as a container instead of using the host's.
# Use only on a Docker VM with enough RAM (~6 GB+) and free disk for the model:
#
#   docker compose -f docker-compose.yml -f docker-compose.bundled-llm.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.bundled-llm.yml \
#       exec ollama ollama pull llama3.1:8b
#
# This adds an `ollama` service and repoints the API at it (overriding the host
# Ollama URL from the base file).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    environment:
      CATERER_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_models:
